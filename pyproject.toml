[project]
name = "hexn"
version = "0.38.0"
description = "PPO/training research on the hexset engine"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# `hexset` (the rules engine, gym, ledger and observation encoder) is its own
# distribution, not part of this one. A published `hexn` pins the HexSet
# release it was released with: the release writes that pin here, by commit.
# In development the engine is checked out beside this package and installed
# from there, at the same commit:
#     pip install --no-deps -e <engine>/src -e .
# HexSet ships no playing bots, and none is declared here: a bot is a
# runtime module the caller provisions beside the engine, as torch is, and
# names with `--runtime <module>` wherever hexn resolves one by name
# (`hexn.runtime`). The tests that seat one skip without it.
dependencies = [
    "hexset @ git+https://github.com/0xBrsm/HexSet.git@cd9d833f728a380dc9ae42f17b0b2a75472696ed",
    "numpy>=1.26",
]

# torch is not declared here either, same reasoning as always: it is
# provisioned separately (the training/GPU image) so the parts of this
# package that don't need it stay installable without it.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hexn*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
